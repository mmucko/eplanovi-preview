// CIKLUS: ◀ ▶ po plohama čiji tooltip odgovara regexu (npr. "1 dokaz") — zoom + popup, brojač
if(CYC && CYC.re){
  var rx=new RegExp(CYC.re,'i'), items=[];
  all.forEach(function(lyr){ lyr.eachLayer(function(l){ var p=l.feature&&l.feature.properties||{};
    if(rx.test(p.tooltip||'')||rx.test(p.popup||'')) items.push(l); }); });
  items.sort(function(a,b){var ca=a.getBounds().getCenter(),cb=b.getBounds().getCenter();return (cb.lat-ca.lat)||(ca.lng-cb.lng);});
  var idx=-1;
  var cc=L.control({position:'bottomleft'}); cc.onAdd=function(){ var d=L.DomUtil.create('div','panel');
    d.innerHTML='<b>'+(CYC.title||'Plohe')+': '+items.length+'</b> &nbsp;<button id=cprev>◀</button> <span id=ccnt>–</span> <button id=cnext>▶</button>'+
      '<div style="font-size:11px;color:#555">Skače po plohama, otvara popup. Zoom se ne dira ako već gledaš izbliza.</div>';
    L.DomEvent.disableClickPropagation(d); return d; };
  cc.addTo(map);
  function go(k){ if(!items.length) return; idx=(k+items.length)%items.length; var l=items[idx];
    var b=l.getBounds(); if(map.getZoom()<17) map.fitBounds(b.pad(2.5),{maxZoom:19}); else map.panTo(b.getCenter());
    l.openPopup(); document.getElementById('ccnt').textContent=(idx+1)+'/'+items.length; }
  document.getElementById('cprev').onclick=function(){go(idx-1);}; document.getElementById('cnext').onclick=function(){go(idx+1);};
}
