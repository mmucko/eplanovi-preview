 {subdomains:['mt0','mt1','mt2','mt3'],maxNativeZoom:20,maxZoom:21,attribution:'Google'});
var baseLayers={'Esri satelit':esri,'Google satelit (oštrije)':gsat};
function edlink(E,N){return 'https://editor-ispu.gov.hr/prostorni-plan/'+PP+'?c='+E+'%2C'+N+'&z=15';}
function st(f){return {color:f.properties.color||'#3388ff',weight:f.properties.weight||2,
  fillColor:f.properties.color||'#3388ff',fillOpacity:.4};}
function oef(f,l){var p=f.properties;
  var pop=(p.popup||'')+'<br>('+p.E+', '+p.N+' / 3765)<br><a href="'+edlink(p.E,p.N)+'" target="_blank">→ otvori u editoru</a>';
  l.bindPopup(pop); if(p.tooltip) l.bindTooltip(p.tooltip);}
// LAYER TOGGLE: jedan sloj po kategoriji (boji), pali/gasi
var overlays={}, all=[], known=[];
c2l.forEach(function(it){ known.push(it[0]);
  var lyr=L.geoJSON(data,{filter:function(f){return f.properties.color===it[0];},style:st,onEachFeature:oef});
  if(lyr.getLayers().length){ lyr.addTo(map); overlays[it[1]]=lyr; all.push(lyr); }});
var other=L.geoJSON(data,{filter:function(f){return known.indexOf(f.properties.color)<0;},style:st,onEachFeature:oef});
if(other.getLayers().length){ other.addTo(map); overlays['Ostalo']=other; all.push(other); }
// OPCIJSKI sloj naziva (naselja) — trajni natpis u centru, outline-only, po defaultu UGAŠEN
var labelData=null;
if(labelData && labelData.features && labelData.features.length){
  var nl=L.geoJSON(labelData,{
    style:function(){return {color:'#ffd400',weight:2,fill:false,dashArray:'4,3'};},
    onEachFeature:function(f,l){var nm=f.properties.name;
      if(nm){l.bindTooltip(nm,{permanent:true,direction:'center',className:'naselje-lbl'});}
      l.bindPopup('Naselje: '+(nm||'?'));}});
  overlays['🏘️ Naselja (nazivi)']=nl;  // NIJE addTo(map) → ugašen dok ga korisnik ne upali
}
L.control.layers(baseLayers,overlays,{collapsed:false,position:'topleft'}).addTo(map);
var grp=L.featureGroup(all);
function fitAll(){ if(data.features.length){ map.invalidateSize(); map.fitBounds(grp.getBounds().pad(0.12)); }
  else { map.setView([45.9,16.45],12); } }
fitAll();
// Kad je karta u iframeu koji se tek razvuce (dashboard s tabovima), Leaflet prvo izmjeri
// sicusan okvir i zumira krivo. Zato jos jednom namjesti kad se izgled slegne.
setTimeout(fitAll, 250); setTimeout(fitAll, 800);
// Poslije toga na promjenu velicine samo prilagodi platno, NE diraj korisnikov zoom.
window.addEventListener('resize', function(){ map.invalidateSize(); });
// DESNI KLIK = koordinate 3765 + editor link
map.on('contextmenu', function(e){
  var en=proj4('EPSG:4326','EPSG:3765',[e.latlng.lng,e.latlng.lat]);
  var E=Math.round(en[0]), N=Math.round(en[1]);
  L.popup().setLatLng(e.latlng).setContent(
    '<div class=coordbox><b>EPSG:3765</b><br>E&nbsp;'+E+'<br>N&nbsp;'+N+
    '<br>lat/lon '+e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)+
    '<br><a href="'+edlink(E,N)+'" target="_blank">→ otvori u editoru</a></div>').openOn(map);
});
// JAKA legenda
var lg=L.control({position:'topright'});lg.onAdd=function(){var d=L.DomUtil.create('div','panel');
 d.innerHTML='<h3>KARTA IZMJENA — kandidat 1 (20260822_121558_runda2_k1.gpkg)</h3><div class=desc>Sve geometrijske izmjene kandidata 1 vs baseline, tagirane na točke mišljenja. Gates: 22/22 PASS (G1 blast-radius, G2 delta-topologija, G3 format/renderer).</div>'+
   '<div class=cats><div style="margin:2px 0"><span style="display:inline-block;width:13px;height:13px;background:#e3170a;border:1px solid #444;margin-right:6px;vertical-align:middle"></span><b>1b: izdvojeno GP (novo)</b> — 64.7 ha</div><div style="margin:2px 0"><span style="display:inline-block;width:13px;height:13px;background:#22aa44;border:1px solid #444;margin-right:6px;vertical-align:middle"></span><b>2a: Gr prošireno</b> — 0.7 ha</div><div style="margin:2px 0"><span style="display:inline-block;width:13px;height:13px;background:#d81b60;border:1px solid #444;margin-right:6px;vertical-align:middle"></span><b>2b: P3 poljoprivredno (novo, van GP)</b> — 9.6 ha</div><div style="margin:2px 0"><span style="display:inline-block;width:13px;height:13px;background:#1e90ff;border:1px solid #444;margin-right:6px;vertical-align:middle"></span><b>3-1: pravilo Višestambena (novo)</b> — 13.3 ha</div><div style="margin:2px 0"><span style="display:inline-block;width:13px;height:13px;background:#00897b;border:1px solid #444;margin-right:6px;vertical-align:middle"></span><b>3-1: pravilo Mješovita gradnja (novo)</b> — 52.3 ha</div></div>'+
   '<div class=hint>Gore-lijevo: pali/gasi kategorije.<br>Klik na plohu = detalji + editor.<br>DESNI klik bilo gdje = koordinate (3765) + editor.</div>';
 L.DomEvent.disableClickPropagation(d);return d;};lg.addTo(map);
</script></body></html>
