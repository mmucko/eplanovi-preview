   font-size:11px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 4px #000,0 0 5px #000}
</style></head><body><div id="map"></div><script>

var data={"type": "FeatureCollection", "features": [{"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[16.379827, 45.885713], [16.383644, 45.886305], [16.389634, 45.887381], [16.389752, 45.888263], [16.389639, 45.888674], [16.389353, 45.889435], [16.388978, 45.889778], [16.38881, 45.889801], [16.388672, 45.889869], [16.388339, 45.889899], [16.387852, 45.890252], [16.387862, 45.890113], [16.386955, 45.889746], [16.385708, 45.889445], [16.385759, 45.88938], [16.38354, 45.888739], [16.383547, 45.888861], [16.383522, 45.888989], [16.383376, 45.889], [16.383001, 45.890363], [16.381109, 45.890158], [16.380377, 45.890008], [16.380349, 45.88998], [16.380156, 45.889952], [16.380116, 45.889961], [16.37982, 45.889919], [16.379824, 45.889904], [16.379706, 45.889887], [16.379844, 45.888068], [16.379839, 45.887939], [16.379724, 45.887378], [16.379699, 45.887048], [16.379615, 45.886987], [16.379826, 45.886238], [16.379827, 45.885713]]]}, "properties": {"grp": "a", "color": "#7b3fa0", "popup": "<b>Stavka 3 · primjedba 1.1.c — eksploatacijsko polje</b><br><span class=bl>BLOK 1</span> <code>KN_1_1</code> fid 7 · id <code>dD3h2tkxk7s6XDkLEvxuEB</code><br>Površina: <b>273.291,53 m² = 27,33 ha</b> (nepromijenjena).<br><br><b>Staro → novo:</b> <code>dodatni_naziv_teme</code>: prazno → „<b>glina</b>”<br>Kod <code>KN-1-1-1210</code> (oznaka <code>E</code>) ostaje isti — Zavod je tražio samo da se navede <b>koja</b> mineralna sirovina se eksploatira.<br><br><i>Nula bajtova geometrije promijenjeno.</i>", "tooltip": "1.1.c eksploatacija — glina", "fillOpacity": 0.2, "noFill": false, "weight": 3, "dash": "7,5", "label": null, "E": 491058, "N": 5083136}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[16.38974, 45.887401], [16.389979, 45.887445], [16.389857, 45.887885], [16.389806, 45.887889], [16.38974, 45.887401]]]}, "properties": {"grp": "a", "color": "#7b3fa0", "popup": "<b>Stavka 3 · primjedba 1.1.c — eksploatacijsko polje</b><br><span class=bl>BLOK 1</span> <code>KN_1_1</code> fid 7 · id <code>dD3h2tkxk7s6XDkLEvxuEB</code><br>Površina: <b>273.291,53 m² = 27,33 ha</b> (nepromijenjena).<br><br><b>Staro → novo:</b> <code>dodatni_naziv_teme</code>: prazno → „<b>glina</b>”<br>Kod <code>KN-1-1-1210</code> (oznaka <code>E</code>) ostaje isti — Zavod je tražio samo da se navede <b>koja</b> mineralna sirovina se eksploatira.<br><br><i>Nula bajtova geometrije promijenjeno.</i>", "tooltip": "1.1.c eksploatacija — glina", "fillOpacity": 0.2, "noFill": false, "weight": 3, "dash": "7,5", "label": null, "E": 491450, "N": 5083107}}, {"type": "Feature", "geometry": {"type": "Point", "coordinates": [16.38478, 45.888008]}, "properties": {"grp": "a", "color": "#7b3fa0", "popup": "<b>Stavka 3 · primjedba 1.1.c — eksploatacijsko polje</b><br><span class=bl>BLOK 1</span> <code>KN_1_1</code> fid 7 · id <code>dD3h2tkxk7s6XDkLEvxuEB</code><br>Površina: <b>273.291,53 m² = 27,33 ha</b> (nepromijenjena).<br><br><b>Staro → novo:</b> <code>dodatni_naziv_teme</code>: prazno → „<b>glina</b>”<br>Kod <code>KN-1-1-1210</code> (oznaka <code>E</code>) ostaje isti — Zavod je tražio samo da se navede <b>koja</b> mineralna sirovina se eksploatira.<br><br><i>Nula bajtova geometrije promijenjeno.</i>", "tooltip": null, "fillOpacity": 0.4, "noFill": false, "weight": 3, "dash": null, "label": "E  ·  dopisano „glina”", "E": 491058, "N": 5083136}}]};
var c2l=[["a", "Eksploatacijsko polje E (KN_1_1 fid 7) (3)"]];
var map=L.map('map',{preferCanvas:true});
var esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {maxNativeZoom:18,maxZoom:21,attribution:'Esri World Imagery'}).addTo(map);
var osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {maxNativeZoom:19,maxZoom:21,attribution:'OpenStreetMap'});
var gsat=L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
 {subdomains:['mt0','mt1','mt2','mt3'],maxNativeZoom:20,maxZoom:21,attribution:'Google'});
var baseLayers={'Esri satelit':esri,'OSM (karta)':osm,'Google satelit':gsat};
function edlink(E,N){return 'editor.html?c='+E+'%2C'+N+'&z=16';}
function st(f){var p=f.properties;var s={color:p.color||'#3388ff',weight:p.weight||3,
  fillColor:p.color||'#3388ff',fillOpacity:(p.fillOpacity==null?0.35:p.fillOpacity)};
  if(p.dash) s.dashArray=p.dash; if(p.noFill) s.fill=false; return s;}
function ptl(f,latlng){return L.circleMarker(latlng,{radius:7,color:'#fff',weight:2,
  fillColor:f.properties.color||'#000',fillOpacity:.95});}
function oef(f,l){var p=f.properties;
  var pop=(p.popup||'')+'<br><span style="color:#666;font-size:11px">('+p.E+', '+p.N+' / EPSG:3765)</span>'+
    '<br><a href="'+edlink(p.E,p.N)+'" target="_blank">&rarr; otvori u editoru</a>';
  l.bindPopup(pop,{maxWidth:400});
  if(p.label){l.bindTooltip(p.label,{permanent:true,direction:'center',className:'lbl'});}
  else if(p.tooltip){l.bindTooltip(p.tooltip);}}
var overlays={}, all=[];
c2l.forEach(function(it){
  var lyr=L.geoJSON(data,{filter:function(f){return f.properties.grp===it[0];},
    style:st,pointToLayer:ptl,onEachFeature:oef});
  if(lyr.getLayers().length){ lyr.addTo(map); overlays[it[1]]=lyr; all.push(lyr); }});
L.control.layers(baseLayers,overlays,{collapsed:false,position:'topleft'}).addTo(map);
var grp=L.featureGroup(all);
function fitAll(){ map.invalidateSize();
  if(data.features.length){ map.fitBounds(grp.getBounds().pad(0.08)); }
  else { map.setView([45.88,16.45],13); } }
fitAll(); setTimeout(fitAll,250); setTimeout(fitAll,900);
window.addEventListener('resize', function(){ map.invalidateSize(); });
map.on('contextmenu', function(e){
  var en=proj4('EPSG:4326','EPSG:3765',[e.latlng.lng,e.latlng.lat]);
  var E=Math.round(en[0]), N=Math.round(en[1]);
  L.popup().setLatLng(e.latlng).setContent(
    '<div class=coordbox><b>EPSG:3765</b><br>E&nbsp;'+E+'<br>N&nbsp;'+N+
    '<br>lat/lon '+e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5)+
    '<br><a href="'+edlink(E,N)+'" target="_blank">&rarr; otvori u editoru</a></div>').openOn(map);
});
var lg=L.control({position:'topright'});lg.onAdd=function(){var d=L.DomUtil.create('div','panel');
 d.innerHTML="<h3>Stavka 3 — eksploatacijsko polje, dopisana „glina” (1.1.c)</h3><div class=desc>Ploha nedirana; upisan je samo naziv sirovine u dodatni naziv teme.</div><div class=cats><div><span class=sw style='background:#7b3fa0'></span>Eksploatacijsko polje E (KN_1_1 fid 7) (3)</div></div><div class=hint>Gore-lijevo: baza (satelit / OSM) + pali/gasi slojeve.<br>Klik na objekt = detalji i brojke. DESNI klik = koordinate (EPSG:3765) + link u ePlanovi editor.<br>Geometrija pojednostavljena 0,8 m samo radi prikaza; sve brojke su iz to&#269;ne geometrije.</div>";
 L.DomEvent.disableClickPropagation(d);return d;};lg.addTo(map);
</script></body></html>
