var c2l=[["d", "DPU-1 - Groblje za ku\u0107ne ljubimce (KN_3_2 fid 23) (2)"]];
var map=L.map('map',{preferCanvas:true});
var esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {maxNativeZoom:18,maxZoom:21,attribution:'Esri World Imagery'}).addTo(map);

 {maxNativeZoom:19,maxZoom:21,attribution:'OpenStreetMap'});

function edlink(E,N){return 'editor.html?c='+E+'%2C'+N+'&z=16';}
function st(f){var p=f.properties;var s={color:p.color||'#3388ff',weight:p.weight||3,
  fillColor:p.color||'#3388ff',fillOpacity:(p.fillOpacity==null?0.35:p.fillOpacity)};
  if(p.dash) s.dashArray=p.dash; if(p.noFill) s.fill=false; return s;}
function ptl(f,latlng){return L.circleMarker(latlng,{radius:7,color:'#fff',weight:2,
  fillColor:f.properties.color||'#000',fillOpacity:.95});}
function oef(f,l){var p=f.properties;
  var pop=(p.popup||'')+'<br><span style="color:#666;font-size:11px">('+p.E+', '+p.N+' / EPSG:3765)</span>'+
    '<br><a href="'+edlink(p.E,p.N)+'" target="_blank">&rarr; otvori u editoru</a>';
  l.bindPopup(pop,{maxWidth:400});
  if(p.label){l.bindTooltip(p.label,{permanent:true,direction:'center',className:'lbl'});}
  else if(p.tooltip){l.bindTooltip(p.tooltip);}}
var overlays={}, all=[];
c2l.forEach(function(it){
  var lyr=L.geoJSON(data,{filter:function(f){return f.properties.grp===it[0];},
    style:st,pointToLayer:ptl,onEachFeature:oef});
  if(lyr.getLayers().length){ lyr.addTo(map); overlays[it[1]]=lyr; all.push(lyr); }});

function fitAll(){ map.invalidateSize();
